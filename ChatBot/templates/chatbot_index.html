<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCorp IT Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 1.2em; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-msg { background: #e9ecef; color: black; align-self: flex-start; border-bottom-left-radius: 0; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header"> TechCorp IT Support</div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-msg">Hello! I am the TechCorp IT Bot. How can I help you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask about TechCorp IT..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" id="send-btn">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');
        const message = inputField.value.trim();

        if (!message) return;

        // 1. Display User Message
        appendMessage(message, 'user-msg');
        inputField.value = '';
        sendBtn.disabled = true;
        sendBtn.innerText = 'Thinking...';

        // 2. Send to Flask Backend
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();

            // 3. Display Bot Message
            if (data.response) {
                appendMessage(data.response, 'bot-msg');
            } else if (data.error) {
                appendMessage("Error: " + data.error, 'bot-msg');
            }
        } catch (error) {
            appendMessage("Network error. Please try again.", 'bot-msg');
        }

        sendBtn.disabled = false;
        sendBtn.innerText = 'Send';
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
